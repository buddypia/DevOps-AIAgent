substitutions:
  _REGION: asia-northeast1
  _SERVICE: agent-guild
  _REPOSITORY: cloud-run-source-deploy
  _RUNTIME_SA: agent-market-runtime

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      # Vertex AI + ADC で動作するためAPIキーSecretは不要 (最小権限SAで実行)
      - --service-account=${_RUNTIME_SA}@$PROJECT_ID.iam.gserviceaccount.com
      # リポジトリ外で設定した外部チェック対象などの環境変数を維持する
      - --update-env-vars=GEMINI_MODEL=gemini-3.5-flash,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=${_REGION},OPS_TARGET_SERVICE=${_SERVICE}
      # コスパガード: scale-to-zero + 上限2インスタンス
      - --min-instances=0
      - --max-instances=2
      - --memory=512Mi
      - --cpu=1

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$BUILD_ID
