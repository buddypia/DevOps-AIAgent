name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Cloud Run region"
        required: true
        default: "asia-northeast1"
      service:
        description: "Cloud Run service name"
        required: true
        default: "agent-guild"
      repository:
        description: "Artifact Registry repository"
        required: true
        default: "cloud-run-source-deploy"
      target_url:
        description: "Public Cloud Run URL to verify after deploy"
        required: true
        default: "https://agent-guild-nxbw7of6cq-an.a.run.app"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Cloud Build deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight deploy secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deploy secret::${name} is required for Deploy Cloud Run."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _REGION=${{ inputs.region }},_SERVICE=${{ inputs.service }},_REPOSITORY=${{ inputs.repository }}

      - name: Verify live surface
        run: |
          set -euo pipefail
          target="${{ inputs.target_url }}"
          # 実稼働: Gemini構成済み + 実行可能エージェント8体
          curl -fsSL "${target}/api/healthz" | jq -e '.ok == true and .geminiConfigured == true and .opsAgent.executableAgents == 8'
          # Agent Card: 実行可能な8スキル + 実機能2スキルのみを公開
          curl -fsSL "${target}/.well-known/agent-card.json" | jq -e '
            any(.skills[]; .id == "ops.triage.execute") and
            any(.skills[]; .id == "brief.analyze") and
            any(.skills[]; .id == "task.delegate.execute") and
            any(.skills[]; .id == "gemini.review.execute") and
            any(.skills[]; .id == "test.contract.execute") and
            any(.skills[]; .id == "security.scan.execute") and
            any(.skills[]; .id == "ux.audit.execute") and
            any(.skills[]; .id == "ops.observe.execute") and
            any(.skills[]; .id == "market.discover") and
            any(.skills[]; .id == "agent-card.discover")
          '
          # ホーム画面が配信されている
          curl -fsSL "${target}/" | grep -E 'Agent Guild|A2A Agent Marketplace'
          # 実行ラン一覧API (Firestore永続化) が応答する
          curl -fsSL "${target}/api/agent-runs?limit=5" | jq -e 'has("runs")'
          # A2A JSON-RPC契約: message/send が有効応答を返す
          curl -fsSL -X POST "${target}/a2a" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":"verify","method":"message/send","params":{"message":{"role":"user","parts":[{"kind":"text","text":"A2A Cloud Run Gemini DevOps"}]}}}' \
            | jq -e '.jsonrpc == "2.0" and .result.status == "completed" and (.result.message.parts[0].data.executableSkillIds | length) == 8'
