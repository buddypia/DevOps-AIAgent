name: Deploy Cloud Run

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Cloud Run region"
        required: true
        default: "asia-northeast1"
      service:
        description: "Cloud Run service name"
        required: true
        default: "a2a-agent-marketplace"
      repository:
        description: "Artifact Registry repository"
        required: true
        default: "cloud-run-source-deploy"
      gemini_secret:
        description: "Secret Manager secret name for GEMINI_API_KEY"
        required: true
        default: "gemini-api-key-a2a-marketplace"
      target_url:
        description: "Public Cloud Run URL to verify after deploy"
        required: true
        default: "https://a2a-agent-marketplace-rfyriohodq-an.a.run.app"

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Cloud Build deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Preflight deploy secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=0
          for name in GCP_PROJECT_ID GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deploy secret::${name} is required for Deploy Cloud Run."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 416.0.0"

      - name: Submit Cloud Build
        run: |
          gcloud builds submit \
            --config cloudbuild.yaml \
            --substitutions _REGION=${{ inputs.region }},_SERVICE=${{ inputs.service }},_REPOSITORY=${{ inputs.repository }},_GEMINI_SECRET=${{ inputs.gemini_secret }}

      - name: Verify public proof surface
        run: |
          set -euo pipefail
          target="${{ inputs.target_url }}"
          curl -fsSL "${target}/api/healthz"
          curl -fsSL "${target}/.well-known/agent-card.json" | jq -e '
            (.skills | length) >= 40 and
            any(.skills[]; .id == "competitive.decision-matrix" and ((.tags // []) | index("decision-matrix-lock"))) and
            any(.skills[]; .id == "judge.first-click-smoke" and ((.tags // []) | index("first-click-smoke-lock"))) and
            any(.skills[]; .id == "submission.dossier" and ((.tags // []) | index("submission-dossier-lock"))) and
            any(.skills[]; .id == "agent-card.shortlist" and ((.tags // []) | index("get-proof"))) and
            any(.skills[]; .id == "agent-card.trial-plan" and ((.tags // []) | index("get-proof"))) and
            any(.skills[]; .id == "agent-card.trial-verification" and ((.tags // []) | index("get-proof"))) and
            any(.skills[]; .id == "agent-card.trial-handoff" and ((.tags // []) | index("get-proof")))
          '
          home="$(curl -fsSL "${target}/")"
          printf '%s' "${home}" | grep -E 'Agent-To-Agent Marketplace'
          homepage_asset="$(printf '%s' "${home}" | sed -n 's|.*src="/assets/\(index-[^"]*\.js\)".*|\1|p' | head -1)"
          test -n "${homepage_asset}"
          homepage_bundle="$(curl -fsSL "${target}/assets/${homepage_asset}")"
          for homepage_copy in 'AI Agent Value Blueprint' 'A buyer decision packet' 'Proof before sharing' 'Start own packet' 'Make the first pilot concrete' 'Do not share this packet externally' 'Load proof-backed sample' 'First action route lock'; do
            printf '%s' "${homepage_bundle}" | grep -F "${homepage_copy}"
          done
          curl -fsSL "${target}/sample/buyer-outcome-brief" | grep -E 'Buyer Outcome Brief'
          curl -fsSL "${target}/api/sample/buyer-outcome-brief" | jq -e '.decision == "repair-before-share" and any(.metrics[]; .id == "live-proof" and .value == "3/5")'
          curl -fsSL "${target}/sample/pilot-run-receipt" | grep -E 'Pilot Receipt|Pilot Run Receipt'
          curl -fsSL "${target}/sample/work-order-brief" | grep -E 'Buyer Work Order Brief'
          curl -fsSL "${target}/buyer-proof-monitor" | grep -E 'Proof monitor|Buyer proof monitor'
          curl -fsSL "${target}/buyer-proof-recovery" | grep -E 'Recovery desk|buyer proof recovery desk'
          curl -fsSL "${target}/sample/agent-card-shortlist" | grep -E 'Agent Card Shortlist|Start with'
          curl -fsSL "${target}/api/sample/agent-card-shortlist" | jq -e '.verdict == "trial-ready" and .candidateCount >= 3 and .leadCandidate.recommendation == "lead-trial"'
          curl -fsSL "${target}/sample/agent-card-trial-plan" | grep -E 'Agent Card Trial Plan|JSON-RPC trial payload'
          curl -fsSL "${target}/api/sample/agent-card-trial-plan" | jq -e '.readiness == "ready-to-run" and .jsonRpcPayload.method == "message/send" and (.evidenceContract | length) >= 5'
          curl -fsSL "${target}/sample/agent-card-trial-verification" | grep -E 'Agent Card Trial Verification|accepted'
          curl -fsSL "${target}/api/sample/agent-card-trial-verification" | jq -e '.status == "accepted" and .score >= 90 and any(.checks[]; .id == "artifact-url" and .status == "pass")'
          curl -fsSL "${target}/sample/agent-card-trial-handoff" | grep -E 'Agent Card Trial Handoff|workspace-ready|Workspace evidence record'
          curl -fsSL "${target}/api/sample/agent-card-trial-handoff" | jq -e '.status == "workspace-ready" and .evidenceRecord.status == "accepted" and (.links | length) >= 4'
          curl -fsSL "${target}/win-autopilot" | grep -E 'Win Autopilot Proof'
          curl -fsSL "${target}/winner-sufficiency" | grep -E 'Winner Sufficiency Lock'
          curl -fsSL "${target}/observability-oracle" | grep -E 'Observability Oracle Proof'
          curl -fsSL "${target}/competitive-decision-matrix" | grep -E 'Competitive Decision Matrix|Head-to-Head Matrix'
          curl -fsSL "${target}/first-click-smoke" | grep -E 'First-Click Smoke Lock'
          curl -fsSL "${target}/api/first-click-smoke" | jq -e '.readiness == "smoke-passed" and .missingCount == 0 and .passedCount >= 14'
          curl -fsSL "${target}/publisher" | grep -E 'Submission Publisher Proof|ProtoPedia Quality Lock'
          curl -fsSL "${target}/dossier" | grep -E 'Submission Dossier Proof|Handoff Packet'
          curl -fsSL -X POST "${target}/a2a" \
            -H 'Content-Type: application/json' \
            --data '{"method":"message/send","params":{"text":"A2A Cloud Run Gemini DevOps"}}' \
            | jq -e '.result.artifacts[0].parts[0].data | .competitiveDecisionMatrixPageEndpoint and .firstClickSmokePageEndpoint and .publisherPageEndpoint and .dossierPageEndpoint and .sampleAgentCardShortlistEndpoint and .agentCardShortlistEndpoint and .sampleAgentCardTrialPlanEndpoint and .agentCardTrialPlanEndpoint and .sampleAgentCardTrialVerificationEndpoint and .agentCardTrialVerificationJsonEndpoint and .sampleAgentCardTrialHandoffEndpoint and .agentCardTrialHandoffJsonEndpoint'
