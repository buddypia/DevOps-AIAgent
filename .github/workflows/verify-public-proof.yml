name: Verify Public Proof

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Public Cloud Run URL to verify"
        required: true
        default: "https://agent-guild-nxbw7of6cq-an.a.run.app"

permissions:
  contents: read

jobs:
  verify:
    name: Live surface
    runs-on: ubuntu-latest
    steps:
      - name: Verify live surface
        run: |
          set -euo pipefail
          target="${{ inputs.target_url }}"
          # 実稼働: Gemini構成済み + 実行可能エージェント8体 + Firestore永続化
          curl -fsSL "${target}/api/healthz" | jq -e '.ok == true and .geminiConfigured == true and .opsAgent.enabled == true and .opsAgent.executableAgents == 8'
          # Agent Card: 実行可能な8スキル + 実機能2スキルのみを公開
          curl -fsSL "${target}/.well-known/agent-card.json" | jq -e '
            any(.skills[]; .id == "ops.triage.execute") and
            any(.skills[]; .id == "brief.analyze") and
            any(.skills[]; .id == "task.delegate.execute") and
            any(.skills[]; .id == "gemini.review.execute") and
            any(.skills[]; .id == "test.contract.execute") and
            any(.skills[]; .id == "security.scan.execute") and
            any(.skills[]; .id == "ux.audit.execute") and
            any(.skills[]; .id == "ops.observe.execute") and
            any(.skills[]; .id == "market.discover") and
            any(.skills[]; .id == "agent-card.discover")
          '
          # ホーム画面が配信されている
          curl -fsSL "${target}/" | grep -E 'Agent Guild|A2A Agent Marketplace'
          # 実行ラン一覧API (Firestore永続化) が応答する
          curl -fsSL "${target}/api/agent-runs?limit=5" | jq -e 'has("runs")'
          # A2Aは無認証の公開実行を拒否する（既定は停止）。
          a2a_response="$(mktemp)"
          a2a_status="$(curl -sS -o "${a2a_response}" -w '%{http_code}' -X POST "${target}/a2a" \
            -H 'Content-Type: application/json' \
            --data '{"jsonrpc":"2.0","id":"verify","method":"message/send","params":{"message":{"role":"user","parts":[{"kind":"text","text":"A2A Cloud Run Gemini DevOps"}]}}}')"
          test "${a2a_status}" = "503"
          jq -e '.error.code == "a2a_disabled"' "${a2a_response}"
          rm -f "${a2a_response}"
