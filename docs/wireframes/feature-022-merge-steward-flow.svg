<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Merge Steward user flow</title>
  <desc id="desc">The user can create a GitHub issue or evaluate a pull request. Only a ready pull request reaches confirmed squash merge.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a8875f"/></marker></defs>
  <rect width="1120" height="460" rx="24" fill="#fffaf3"/>
  <g stroke="#f3c78d" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M200 90H330"/><path d="M475 90H600"/><path d="M745 90H870"/>
    <path d="M405 125V230H600"/><path d="M745 265H870"/><path d="M675 300V375H510"/><path d="M675 300V375H685"/><path d="M675 300V375H870"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <g fill="#ffffff" stroke="#f3c78d" stroke-width="2">
      <rect x="35" y="55" width="165" height="70" rx="18"/><rect x="330" y="55" width="145" height="70" rx="18"/><rect x="600" y="55" width="145" height="70" rx="18"/><rect x="870" y="55" width="210" height="70" rx="18"/>
      <rect x="330" y="230" width="145" height="70" rx="18"/><rect x="600" y="230" width="145" height="70" rx="18"/>
    </g>
    <rect x="870" y="230" width="210" height="70" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <rect x="420" y="375" width="180" height="60" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="610" y="375" width="150" height="60" rx="16" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <rect x="780" y="375" width="180" height="60" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <g fill="#3d2a14"><text x="118" y="96">Merge Steward</text><text x="402" y="96">問題入力</text><text x="672" y="96">Issue preview</text><text x="975" y="96">確認 → Issue作成</text><text x="402" y="271">PR番号</text><text x="672" y="261">証拠取得</text><text x="672" y="282">＋安全ゲート</text><text x="975" y="271">READY → merge確認</text><text x="510" y="410">squash merge</text><text x="685" y="410">人間レビュー</text><text x="870" y="410">BLOCKED</text></g>
  </g>
</svg>
