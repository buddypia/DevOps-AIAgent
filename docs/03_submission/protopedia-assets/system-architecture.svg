<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Guild システム構成図</title>
  <desc id="desc">Cloud Run、Gemini、専門エージェント、実証拠、独立検証、Firestore、CI/CDの関係を示す。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07130f"/><stop offset="1" stop-color="#101d19"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7f06b"/><stop offset="1" stop-color="#78c950"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5 0 10Z" fill="#b7f06b"/></marker>
    <style>
      text{font-family:'Hiragino Sans','Yu Gothic',sans-serif}.k{font-size:17px;font-weight:700;letter-spacing:2px;fill:#b7f06b}.t{font-size:42px;font-weight:800;fill:#f4f8f5}.s{font-size:18px;fill:#aebdb5}.c{fill:#14221d;stroke:#32463d;stroke-width:2}.ct{font-size:25px;font-weight:800;fill:#f4f8f5}.cs{font-size:16px;fill:#b8c5bf}.ch{font-size:14px;font-weight:700;fill:#d8e5de}.dk{fill:#0b1712}.ln{fill:none;stroke:#b7f06b;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><circle cx="1510" cy="-40" r="320" fill="#5b9d43" opacity=".08"/><circle cx="80" cy="900" r="300" fill="#b7f06b" opacity=".05"/>
  <text x="70" y="65" class="k">DEVOPS × AI AGENT</text><text x="70" y="115" class="t">Agent Guild システム構成</text><text x="70" y="151" class="s">実システムの証拠を集め、二重検証を通った所見だけを対応計画へ</text>
  <g filter="url(#shadow)"><rect x="70" y="205" width="245" height="145" rx="20" class="c"/><text x="100" y="247" class="k">INPUT</text><text x="100" y="286" class="ct">ユーザー</text><text x="100" y="317" class="cs">目標を1つ入力</text><text x="100" y="339" class="cs">または外部A2A</text></g>
  <g filter="url(#shadow)"><rect x="405" y="190" width="370" height="175" rx="22" fill="#1b3027" stroke="#b7f06b" stroke-width="3"/><text x="440" y="232" class="k">GOOGLE CLOUD RUN</text><text x="440" y="275" class="ct">React UI + Express API</text><text x="440" y="307" class="cs">Agent Card / A2A JSON-RPC / healthz</text><rect x="440" y="326" width="135" height="24" rx="12" fill="#29443a"/><text x="455" y="343" class="ch">Cloud Build配備</text><rect x="585" y="326" width="150" height="24" rx="12" fill="#29443a"/><text x="599" y="343" class="ch">9体の調査役</text></g>
  <g filter="url(#shadow)"><rect x="865" y="190" width="370" height="175" rx="22" fill="url(#green)"/><text x="895" y="232" class="k dk" style="font-size:14px">GEMINI 3.5 FLASH / VERTEX AI</text><text x="895" y="275" class="ct dk">自律オーケストレーター</text><text x="895" y="307" class="cs dk">9体から最大4体を選抜</text><text x="895" y="337" class="cs dk">続行 / スキップ / 1体追加を適応判断</text></g>
  <g filter="url(#shadow)"><rect x="1325" y="205" width="205" height="145" rx="20" class="c"/><text x="1355" y="247" class="k">OUTPUT</text><text x="1355" y="286" class="ct">統合レポート</text><text x="1355" y="317" class="cs">優先度付き対応計画</text><text x="1355" y="339" class="cs">runId引用・監査可能</text></g>
  <path d="M315 277H395M775 277H855M1235 277H1315" class="ln"/>
  <g filter="url(#shadow)"><rect x="70" y="445" width="500" height="238" rx="22" class="c"/><text x="105" y="488" class="k">REAL EVIDENCE</text><text x="105" y="528" class="ct">実証拠を収集</text><rect x="105" y="555" width="200" height="38" rx="10" fill="#20342c"/><text x="121" y="580" class="ch">Cloud Logging</text><rect x="320" y="555" width="210" height="38" rx="10" fill="#20342c"/><text x="336" y="580" class="ch">GitHub Actions + API</text><rect x="105" y="607" width="200" height="38" rx="10" fill="#20342c"/><text x="121" y="632" class="ch">OSV.dev 脆弱性DB</text><rect x="320" y="607" width="210" height="38" rx="10" fill="#20342c"/><text x="336" y="632" class="ch">配信中HTML / Agent Card</text></g>
  <g filter="url(#shadow)"><rect x="650" y="425" width="570" height="278" rx="22" fill="#132820" stroke="#4f7565" stroke-width="2"/><text x="685" y="468" class="k">VERIFICATION PIPELINE</text><text x="685" y="508" class="ct">全調査役共通の二重検証</text><rect x="685" y="545" width="94" height="68" rx="12" fill="#243a31"/><text x="706" y="585" class="ch">証拠収集</text><rect x="805" y="545" width="106" height="68" rx="12" fill="#243a31"/><text x="821" y="575" class="ch">Gemini</text><text x="826" y="597" class="ch">maker</text><rect x="937" y="545" width="106" height="68" rx="12" fill="#243a31"/><text x="951" y="585" class="ch">引用ゲート</text><rect x="1069" y="545" width="116" height="68" rx="12" fill="#243a31"/><text x="1083" y="575" class="ch">独立Gemini</text><text x="1097" y="597" class="ch">checker</text><path d="M779 579H795M911 579H927M1043 579H1059" class="ln"/><rect x="685" y="635" width="500" height="38" rx="10" fill="#b7f06b"/><text x="711" y="660" class="ch dk">受入所見のみ統合　　critical/high → 人間承認待ち</text></g>
  <g filter="url(#shadow)"><rect x="1300" y="445" width="230" height="238" rx="22" class="c"/><text x="1335" y="488" class="k">FIRESTORE</text><text x="1335" y="528" class="ct">実行履歴</text><text x="1335" y="566" class="cs">ラン数・受入所見</text><text x="1335" y="594" class="cs">採用率・checker一致率</text><text x="1335" y="622" class="cs">コスト見積り</text><text x="1335" y="650" class="cs">ランク自動算出</text></g>
  <path d="M865 365C865 404 570 388 570 435M1050 365V415M1220 564H1290" class="ln"/>
  <g filter="url(#shadow)"><rect x="70" y="770" width="1460" height="80" rx="18" fill="#0b1511" stroke="#34463f" stroke-width="2"/><text x="105" y="806" class="k">DEVOPS DELIVERY</text><text x="330" y="809" class="ct">GitHub → GitHub Actions CI → Cloud Build → Cloud Run</text><text x="1100" y="809" class="cs">typecheck / test / build / architecture check</text></g>
</svg>
